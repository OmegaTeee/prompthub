OPENAI_HOST: http://127.0.0.1:9090
OPENAI_BASE_PATH: v1/chat/completions
OPENAI_TIMEOUT: '600'
extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  prompthub-bridge:
    enabled: true
    type: stdio
    name: prompthub-bridge
    cmd: node
    args:
    - /Users/visualval/prompthub/mcps/prompthub-bridge.js
    timeout: 300
    envs:
      AUTHORIZATION: Bearer sk-prompthub-vault-writer-001
      CLIENT_NAME: vault-writer
      PROMPTHUB_URL: http://127.0.0.1:9090
      SERVERS: memory,sequential-thinking,desktop-commander,context7
    bundled: false
    available_tools: []
  skills-mcp:
    enabled: true
    type: stdio
    name: skills-mcp
    cmd: npx
    args:
    - -y
    - skills-mcp
    - -s
    - /Users/visualval/.local/share/prompthub/skills-curated
    - -s
    - /Users/visualval/.claude/skills
    timeout: 300
    bundled: false
    available_tools: []
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
providers:
  openai:
    enabled: true
    model: ornith-1.0-9b-coder
    configured: true
  lmstudio:
    enabled: true
    model: qwen3.5-9b-sushi-coder-rl
    configured: true
  codex-acp:
    enabled: true
    model: current
    configured: true
  pi-acp:
    enabled: true
    model: current
    configured: true
  claude-acp:
    enabled: true
    model: default
    configured: true
active_provider: lmstudio
GOOSE_MOIM_MESSAGE_FILE: /Users/visualval/.local/share/prompthub/clients/goose/tools-policy.md
GOOSE_TELEMETRY_ENABLED: true
codex-acp_configured: true
pi-acp_configured: true
claude-acp_configured: true
CLAUDE_CODE_COMMAND: claude
PI_ACP_ENABLE_EMBEDDED_CONTEXT: true
LMSTUDIO_HOST: http://localhost:1234
