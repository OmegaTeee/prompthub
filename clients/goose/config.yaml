# clients/goose/config.yaml
GOOSE_PROVIDER: openai
# 4b-instruct: clean tool_calls format + validated for autonomous tool chains (skills routing).
# vault-goose wrapper overrides GOOSE_MODEL=qwen3-coder-30b-a3b-instruct for prose/doc edits.
GOOSE_MODEL: qwen3-4b-instruct-2507
# Route model calls through PromptHub /v1 (audit + privacy), enhance disabled via the key below
OPENAI_HOST: http://127.0.0.1:9090
OPENAI_BASE_PATH: v1/chat/completions
OPENAI_TIMEOUT: '600'

extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    bundled: true
    available_tools: []
  todo:
    enabled: true
    type: platform
    name: todo
    bundled: true
    available_tools: []
  prompthub-bridge:
    enabled: true
    type: stdio
    name: prompthub-bridge
    cmd: node
    args:
      - /Users/visualval/prompthub/mcps/prompthub-bridge.js
    timeout: 300
    envs:
      AUTHORIZATION: Bearer sk-prompthub-vault-writer-001
      CLIENT_NAME: vault-writer
      PROMPTHUB_URL: http://127.0.0.1:9090
      SERVERS: memory,sequential-thinking,desktop-commander,context7
    bundled: false
    available_tools: []
  skills-mcp:
    enabled: true
    type: stdio
    name: skills-mcp
    cmd: npx
    args:
      - -y
      - skills-mcp
      - -s
      - /Users/visualval/.local/share/prompthub/skills-curated
      - -s
      - /Users/visualval/.claude/skills
    timeout: 300
    bundled: false
    available_tools: []
