name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        # Scoped to router/ until existing test lint debt is cleaned separately.
        # tests/ has its own lint debt (11x F821 undefined names — actual bugs)
        run: ruff check router/ --output-format=github

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          WORKSPACE_ROOT=${{ github.workspace }} pytest \
            tests/test_cache.py \
            tests/test_circuit_breaker.py \
            tests/test_cloud_fallback.py \
            tests/test_mcp_gateway.py \
            tests/test_memory.py \
            tests/test_openai_compat.py \
            tests/test_persistent_cache.py \
            tests/test_privacy_level.py \
            tests/test_routing.py \
            tests/unit/ \
            -v --cov=router --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./app/coverage.xml
          fail_ci_if_error: false

  bridge:
    name: Bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcps
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcps/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check bridge syntax
        run: node --check prompthub-bridge.js

      - name: Run bridge tests
        run: node --test bridge-result.test.js
